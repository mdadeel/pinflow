<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pinterest Publisher</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
    nav { background: #e60023; padding: .6rem 1rem; }
    nav a { color: #fff; text-decoration: none; margin-right: 1.2rem; font-weight: 600; }
    main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
    .cards { display: flex; gap: 1rem; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 1rem 1.5rem; }
    .card b { display: block; font-size: 1.8rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #eee; vertical-align: top; }
    th { background: #f2f2f2; }
    img.thumb { width: 80px; height: auto; border-radius: 4px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day { background: #fff; border: 1px solid #eee; min-height: 90px; padding: .3rem; font-size: .75rem; }
    .muted { color: #888; }
  </style>
</head>
<body>
<nav>
  <a href="/">Overview</a><a href="/library">Library</a>
  <a href="/calendar">Calendar</a><a href="/analytics">Analytics</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
